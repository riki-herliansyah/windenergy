name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'my-ppt/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: my-ppt
        run: npm install

      - name: Build project
        working-directory: my-ppt
        run: npm run build

      - name: Deploy to GitHub Pages
        working-directory: my-ppt
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
